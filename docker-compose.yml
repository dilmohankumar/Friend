# Local stack: PostgreSQL + Redis + MinIO (S3) + API
#   docker compose up --build
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: situationship, POSTGRES_PASSWORD: situationship, POSTGRES_DB: situationship }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U situationship"], interval: 5s, retries: 10 }

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/situationship-photos"

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://situationship:situationship@postgres:5432/situationship
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://10.0.2.2:3000
      DEV_SHOW_OTP: "true"
      MOCK_KYC: "true"
      SEED_DEMO: "true"
      STORAGE_DRIVER: s3
      S3_BUCKET: situationship-photos
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://10.0.2.2:9000   # presigned URLs must be reachable from the phone/emulator
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      DATA_DIR: /app/.data

volumes: { pgdata: {}, miniodata: {} }
